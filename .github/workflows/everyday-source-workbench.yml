name: Everyday source workbench

on:
  push:
    branches: [feat/everyday-r32-surfaces-20260913]
    paths: [.github/workflows/everyday-source-workbench.yml]

permissions:
  contents: read

jobs:
  tools:
    if: github.repository == 'hashgraph-online/hol-guard' && github.actor_id == '6068672'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Copy the formatter binary only
        run: cp .venv/bin/ruff "$RUNNER_TEMP/ruff"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-ruff-${{ github.sha }}
          path: ${{ runner.temp }}/ruff
          if-no-files-found: error
          retention-days: 3
