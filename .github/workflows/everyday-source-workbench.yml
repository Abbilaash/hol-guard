name: Everyday source workbench

on:
  push:
    branches: [feat/everyday-r32-surfaces-20260913]
    paths: [.github/workflows/everyday-source-workbench.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'hashgraph-online/hol-guard' && github.actor_id == '6068672'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare locked development dependencies
        run: |
          uv sync --frozen --extra dev --python 3.11
          cd dashboard && bun install --frozen-lockfile
      - name: Archive only public source and installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/everyday-source.tar.gz"
          tar -czf "$RUNNER_TEMP/everyday-python-deps.tar.gz" -C .venv/lib/python3.11/site-packages .
          tar -czf "$RUNNER_TEMP/everyday-dashboard-deps.tar.gz" -C dashboard node_modules
          cp "$(command -v bun)" "$RUNNER_TEMP/bun"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-workbench-${{ github.sha }}
          path: |
            ${{ runner.temp }}/everyday-source.tar.gz
            ${{ runner.temp }}/everyday-python-deps.tar.gz
            ${{ runner.temp }}/everyday-dashboard-deps.tar.gz
            ${{ runner.temp }}/bun
          if-no-files-found: error
          retention-days: 3
