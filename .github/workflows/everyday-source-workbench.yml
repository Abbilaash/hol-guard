name: Everyday source workbench

on:
  push:
    branches: [feat/everyday-r32-surfaces-20260913]
    paths: [.github/workflows/everyday-source-workbench.yml]

permissions:
  contents: read

jobs:
  runtime:
    if: github.repository == 'hashgraph-online/hol-guard' && github.actor_id == '6068672'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Archive the public Python runtime without credentials or user data
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(python -c 'import sys; print(sys.base_prefix)')
          tar --exclude=__pycache__ --exclude=site-packages -czf "$RUNNER_TEMP/everyday-python-runtime.tar.gz" -C "$runtime" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-python-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/everyday-python-runtime.tar.gz
          if-no-files-found: error
          retention-days: 3
